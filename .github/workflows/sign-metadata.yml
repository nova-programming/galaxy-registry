name: Sign registry metadata

# Re-signs packages/*.json whenever metadata changes so `galaxy install` can verify it
# (Ed25519, see tools/sign_registry.py). Requires the GALAXY_SIGNING_KEY repository secret
# (the private seed from `galaxy keygen`); without it the job skips signing.

on:
  push:
    branches: [main]
    paths:
      - 'packages/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signing dependency
        run: python -m pip install cryptography

      - name: Sign metadata
        env:
          GALAXY_SIGNING_KEY: ${{ secrets.GALAXY_SIGNING_KEY }}
        run: python tools/sign_registry.py packages

      - name: Commit signatures
        run: |
          if [ -n "$(git status --porcelain packages)" ]; then
            git config user.name "galaxy-signer"
            git config user.email "galaxy-signer@users.noreply.github.com"
            git add packages/*.sig
            git commit -m "chore: update registry signatures [skip ci]"
            git push
          else
            echo "No signature changes."
          fi
