<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Logo mark -->
  <g transform="translate(90,90)">
    <polygon points="34,0 0,15 34,34 68,15" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="0,43 34,58 68,43" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="0,29 34,44 68,29" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="178" y="138" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">Galaxy</text>

  <!-- Headline -->
  <text x="90" y="300" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#f0f6fc">The package registry</text>
  <text x="90" y="368" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#f0f6fc">for the <tspan fill="#2f81f7">Nova</tspan> language</text>

  <!-- Subcopy -->
  <text x="90" y="430" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8b949e">Native compilation &#183; Python-like syntax &#183; Built-in GUI framework</text>

  <!-- Footer row -->
